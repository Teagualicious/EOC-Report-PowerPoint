name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag override (defaults to VERSION)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="$(tr -d ' \r\n' < VERSION)"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *dev* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Development VERSION detected; no release will be published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standard and offline archives
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          VER="${{ steps.version.outputs.value }}"
          mkdir -p build/src
          git archive HEAD | tar -x -C build/src
          (cd build/src && zip -qr "$GITHUB_WORKSPACE/DeckEngine-$VER.zip" .)
          mkdir -p build/src/wheelhouse
          python -m pip download -r app/requirements.txt -d build/src/wheelhouse \
            --platform win_amd64 --python-version 312 --only-binary=:all:
          (cd build/src && zip -qr \
            "$GITHUB_WORKSPACE/DeckEngine-$VER-portable-win64.zip" .)

      - name: Extract release notes
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          awk '/^## /{n++} n==1' documentation/CHANGELOG.md > release_notes.md
          test -s release_notes.md || echo "See documentation/CHANGELOG.md." > release_notes.md

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VER="${{ steps.version.outputs.value }}"
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$VER already exists; replacing archive assets only."
          else
            gh release create "$VER" --target "$GITHUB_SHA" \
              --title "Deck Engine $VER" --notes-file release_notes.md
          fi
          gh release upload "$VER" --repo "$GITHUB_REPOSITORY" \
            "DeckEngine-$VER.zip" \
            "DeckEngine-$VER-portable-win64.zip" --clobber
