name: Release

# Creates the tag and GitHub Release for a finished PR (CLAUDE.md workflow
# rule 5). Push-driven: bump the VERSION file (plus the CHANGELOG top entry,
# which becomes the release notes) inside the PR — merging to main publishes
# the release automatically. Remote Claude Code sessions cannot push tags or
# call the release API, so no per-release API access is ever needed.
# Manual dispatch remains as a fallback (version input overrides the file).
# Already-released versions are skipped, so unrelated pushes are no-ops.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag override, e.g. v1.25.0 (defaults to the VERSION file)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="$(tr -d ' \r\n' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.v.outputs.version }} already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract top CHANGELOG entry
        if: steps.released.outputs.exists == 'false'
        run: |
          awk '/^## /{n++} n==1' documentation/CHANGELOG.md > release_notes.md
          test -s release_notes.md || echo "See documentation/CHANGELOG.md." > release_notes.md
          cat >> release_notes.md <<EOF

          ---
          **Which download?** Grab \`IngestionEngine-${{ steps.v.outputs.version }}-portable-win64.zip\` below — extract anywhere and double-click \`Start Ingestion Engine.bat\`. The first launch sets up its bundled packages automatically (offline, under a minute; requires Python 3.12 from python.org). The plain "Source code" zips work too, but install packages from the internet on first run.
          EOF

      - name: Create tag and release
        if: steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "Ingestion Engine ${{ steps.v.outputs.version }}" \
            --notes-file release_notes.md

      # Portable zip: the full source tree plus a wheelhouse/ of Windows
      # wheels for every runtime dependency. The launcher installs from the
      # wheelhouse offline when it is present, so the zip runs on a machine
      # with only Python installed — no network, nothing else to download.
      - name: Set up Python for the wheelhouse
        if: steps.released.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable zip (source + Windows wheelhouse)
        if: steps.released.outputs.exists == 'false'
        run: |
          mkdir -p portable/wheelhouse
          git archive HEAD | tar -x -C portable
          python -m pip download -r app/requirements.txt -d portable/wheelhouse \
            --platform win_amd64 --python-version 312 --only-binary=:all:
          # pywin32's "sys_platform == win32" marker evaluates false on this
          # Linux runner and pip skips it — fetch the Windows wheel explicitly
          # (keep the version in sync with app/requirements.txt)
          PYWIN32_PIN="$(grep -oE 'pywin32==[0-9]+' app/requirements.txt)"
          python -m pip download "$PYWIN32_PIN" -d portable/wheelhouse \
            --platform win_amd64 --python-version 312 --only-binary=:all:
          (cd portable && zip -qr \
            "../IngestionEngine-${{ steps.v.outputs.version }}-portable-win64.zip" .)

      - name: Attach portable zip to the release
        if: steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.v.outputs.version }}" \
            "IngestionEngine-${{ steps.v.outputs.version }}-portable-win64.zip" --clobber
